; supervisor program for deploy/an_dashboard.sh. For a new project rename the program (an_dashboard) and the
; script path in command= (使用指南.md §7.1), then: supervisorctl reread && supervisorctl update
[program:an_dashboard]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/an_dashboard.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
# Must output to /dev/stdout for Vast logging alongside the Portal logs
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
