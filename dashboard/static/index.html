<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奇创纪元科研监控大屏-听神经瘤专项</title>
<meta name="description" content="Real-time bilingual monitor for the acoustic neuroma (vestibular schwannoma) deep-learning research project">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304080f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%2322d3ee' stroke-width='4'/%3E%3Cpath d='M12 34h10l5-12 7 22 6-16 4 6h8' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!-- bundled copies (no CDN needed; versions, licenses and hashes in vendor/README.md) -->
<script src="vendor/echarts-5.5.0.min.js" defer></script>
<script src="vendor/marked-12.0.2.min.js" defer></script>
<script src="vendor/purify-3.1.6.min.js" defer></script>
<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo-plate"><img class="logo" src="logo.svg" alt="奇创纪元 QICHUANG ERA" decoding="async"></span>
    <div>
      <h1 data-i18n="app_title">奇创纪元科研监控大屏-听神经瘤专项</h1>
      <div class="sub" id="project-name" data-i18n="app_subtitle">听神经瘤（前庭神经鞘瘤）· 深度学习自主研究</div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="views">
    <a href="#/overview" data-view="overview" data-i18n="tab_overview">Overview</a>
    <a href="#/workflow" data-view="workflow" data-i18n="tab_workflow">Workflow</a>
    <a href="#/training" data-view="training" data-i18n="tab_training">Training</a>
    <a href="#/results" data-view="results" data-i18n="tab_results">Results</a>
    <a href="#/leaderboard" data-view="leaderboard" data-i18n="tab_leaderboard">Leaderboard</a>
    <a href="#/agents" data-view="agents" data-i18n="tab_agents">Agents</a>
    <a href="#/session" data-view="session" data-i18n="tab_session">Session</a>
    <a href="#/literature" data-view="literature" data-i18n="tab_literature">Literature</a>
    <a href="#/paper" data-view="paper" data-i18n="tab_paper">Paper</a>
    <a href="#/system" data-view="system" data-i18n="tab_system">System</a>
    <a href="#/events" data-view="events" data-i18n="tab_events">Events</a>
  </nav>
  <div class="status-bar">
    <span class="pill" id="phase-pill"><span class="dot run"></span><span id="phase-name">—</span></span>
    <span class="pill"><span class="conn-dot" id="conn-dot"></span><span id="conn-text" data-i18n="conn_connecting">connecting</span></span>
    <span class="pill"><span data-i18n="last_update">Last update</span>&nbsp;<span id="last-update" class="mono">—</span></span>
    <button class="pill pill-btn alert-pill" id="alert-pill" type="button" hidden><span class="al-ic">⚠</span><span id="alert-n">0</span></button>
    <button class="pill pill-btn mono" id="zoom-pill" type="button" data-i18n-title="zoom_title">100%</button>
    <span id="clock">--:--:--</span>
    <button class="btn" id="kiosk-btn" type="button" aria-pressed="false" data-i18n-title="kiosk_title"><span data-i18n="kiosk_btn">Kiosk</span><kbd>K</kbd></button>
    <select id="kiosk-int" class="kiosk-int" hidden data-i18n-title="kiosk_int_title">
      <option value="30">30 s</option><option value="45">45 s</option><option value="60">60 s</option><option value="120">120 s</option>
    </select>
    <button class="btn" id="lang-btn" type="button" data-i18n-title="lang_toggle_title"><span id="lang-label">EN</span><kbd>L</kbd></button>
    <button class="btn" id="help-btn" type="button" data-i18n-title="kb_title"><kbd style="margin:0">?</kbd></button>
  </div>
  <div class="kiosk-bar" id="kiosk-bar" hidden><i></i></div>
</header>
<div class="alert-strip" id="alert-strip" hidden aria-live="polite"></div>

<main id="main">
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-workflow"></section>
  <section class="view" id="view-training"></section>
  <section class="view" id="view-results"></section>
  <section class="view" id="view-leaderboard"></section>
  <section class="view" id="view-agents"></section>
  <section class="view" id="view-session"></section>
  <section class="view" id="view-literature"></section>
  <section class="view" id="view-paper"></section>
  <section class="view" id="view-system"></section>
  <section class="view" id="view-events"></section>
  <noscript>本监控大屏需要启用 JavaScript。 This dashboard needs JavaScript.</noscript>
</main>
<footer class="foot">
  <span data-i18n="footer_readonly">Read-only monitor · only the Session tab sends messages to the orchestrator</span>
  <span>·</span>
  <span data-i18n="footer_poll">Polling every 4 s</span>
  <span>·</span>
  <span data-i18n="footer_shortcut">Press L to switch language</span>
  <span class="grow"></span>
  <span id="lib-status" class="mono"></span>
</footer>
</body>
</html>
